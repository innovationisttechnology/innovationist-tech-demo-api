[project]
name = "innovationist-tech-demo-api"
version = "1.0.0"
description = "Innovationist Technology Solutions — Demo API"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.138.2",
    "uvicorn[standard]",
    "pydantic[email]",
    "pydantic-settings",
    "beanie",
    "pymongo",
    "pydantic-ai>=2.5.0",
    "fastembed>=0.7.0",
    "python-dotenv>=1.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "puremagic>=1.28",
    "pillow>=11.0.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pre-commit>=4.0.0",
]
evals = [
    "pydantic-evals>=2.5.0",
    "sentence-transformers>=5.6.0",
]

[tool.ruff]
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: tests that require a live MongoDB replica set (skipped unless TEST_MONGO_URI is set)",
]

[tool.mypy]
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disable_error_code = ["type-arg"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
